name: Validate Lattice Active Frontier

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: lattice
          POSTGRES_PASSWORD: lattice
          POSTGRES_DB: lattice
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lattice -d lattice"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      LATTICE_TEST_POSTGRES_URL: postgresql://lattice:lattice@127.0.0.1:5432/lattice
    steps:
      - uses: actions/checkout@v6
      - name: Validate release version metadata
        run: python3 scripts/check_version.py
      - name: Validate repository and state contract
        run: python3 scripts/lattice.py validate
      - name: Validate evaluation scenario registry
        run: python3 scripts/evaluation.py validate
      - name: Run executable autonomy evaluations
        run: |
          mkdir -p /tmp/lattice-evals
          python3 scripts/evaluation_scenarios.py greenfield-feature-delivery --host ci --run-id ci-greenfield > /tmp/lattice-evals/greenfield.json
          python3 scripts/evaluation_scenarios.py verifier-disagreement --host ci --run-id ci-verifier > /tmp/lattice-evals/verifier.json
          python3 scripts/evaluation_scenarios.py worker-crash-and-lease-expiry --host ci --run-id ci-recovery > /tmp/lattice-evals/recovery.json
          python3 scripts/evaluation_adversarial_scenarios.py ambiguous-requirements-escalation --host ci --run-id ci-ambiguous > /tmp/lattice-evals/ambiguous.json
          python3 scripts/evaluation_adversarial_scenarios.py contradictory-new-information --host ci --run-id ci-contradiction > /tmp/lattice-evals/contradiction.json
          python3 scripts/evaluation_adversarial_scenarios.py multi-project-capacity-contention --host ci --run-id ci-portfolio > /tmp/lattice-evals/portfolio.json
          python3 scripts/evaluation_delivery_scenarios.py cross-component-refactor --host ci --run-id ci-refactor > /tmp/lattice-evals/refactor.json
          python3 scripts/evaluation_delivery_scenarios.py migration-work --host ci --run-id ci-migration > /tmp/lattice-evals/migration.json
          python3 scripts/evaluation_delivery_scenarios.py ci-remediation --host ci --run-id ci-remediation > /tmp/lattice-evals/ci-remediation.json
          python3 scripts/evaluation_gate.py /tmp/lattice-evals/*.json
      - name: Install optional Postgres test driver
        run: python3 -m pip install "psycopg[binary]>=3.2,<4"
      - name: Run live Postgres autonomy evaluation
        run: |
          python3 scripts/evaluation_postgres_scenarios.py concurrent-artifact-conflict --host ci-postgres --run-id ci-postgres-conflict > /tmp/lattice-evals/postgres-conflict.json
          python3 scripts/evaluation_gate.py /tmp/lattice-evals/*.json
      - name: Run state-engine tests
        if: ${{ always() }}
        run: python3 -m unittest discover -s tests -v
