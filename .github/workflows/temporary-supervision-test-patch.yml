name: Temporary supervision test patch

on:
  pull_request:
    branches: [master]

permissions:
  contents: write

jobs:
  patch:
    if: github.head_ref == 'feat/0.1.3-portfolio-agent-dashboard'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/0.1.3-portfolio-agent-dashboard
      - name: Update supervision exit expectations
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('tests/test_postgres_supervision_exit.py')
          s = p.read_text()
          old = '''            # The human page presents the same model as a control loop rather than a state dump.\n            for phrase in (\n                "Doing Project",\n                "Changed Project",\n                "Blocked Project",\n                "Decide whether to accept the external consequence",\n                "Why this is yours",\n                "Your decisions",\n                "Working toward",\n                "Now",\n                "Next",\n                "Needs attention",\n                "What changed",\n                "Milestone accepted",\n                "System health",\n                "Oldest attention",\n                "Consequence graph",\n                "If you act",\n            ):\n                self.assertIn(phrase, page)\n            self.assertIn("<form", page)\n            self.assertIn("<button", page)\n'''
          new = '''            # The portfolio page exposes management state and live agents; deeper evidence lives on project detail.\n            for phrase in (\n                "Project Portfolio",\n                "Doing Project",\n                "Changed Project",\n                "Blocked Project",\n                "Needs your decision",\n                "Decide whether to accept the external consequence",\n                "Active Projects",\n                "Agents",\n                "Application",\n                "Architecture",\n                "Director",\n                "Working",\n                "Blocked",\n                "Project detail",\n            ):\n                self.assertIn(phrase, page)\n            self.assertNotIn("What changed", page)\n            self.assertNotIn("Inspect evidence and consequence state", page)\n'''
          if old not in s:
              raise SystemExit('expected old supervision render assertions not found')
          p.write_text(s.replace(old, new, 1))
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add tests/test_postgres_supervision_exit.py
          git commit -m "Update supervision exit for portfolio dashboard"
          git push origin HEAD:feat/0.1.3-portfolio-agent-dashboard
