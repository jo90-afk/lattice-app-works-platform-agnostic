name: Temporary principal milestone patch

on:
  pull_request:
    branches: [master]

permissions:
  contents: write

jobs:
  patch:
    if: github.head_ref == 'fix/0.1.5-principal-milestone-context'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/0.1.5-principal-milestone-context
      - name: Apply milestone context fix
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json

          # Read model: retain full milestone history and expose a current milestone
          # that falls back to the latest accepted milestone when no active one exists.
          p = Path('scripts/control_plane.py')
          s = p.read_text()
          old = '''    milestone = store.conn.execute(\n        "SELECT * FROM milestones WHERE project_id = ? AND status = 'active'",\n        (project_id,),\n    ).fetchone()\n'''
          new = '''    milestone = store.conn.execute(\n        "SELECT * FROM milestones WHERE project_id = ? AND status = 'active'",\n        (project_id,),\n    ).fetchone()\n    milestones = [\n        dict(row)\n        for row in store.conn.execute(\n            """SELECT * FROM milestones WHERE project_id = ?\n               ORDER BY ordinal, created_at, id""",\n            (project_id,),\n        ).fetchall()\n    ]\n    latest_accepted_milestone = next(\n        (item for item in reversed(milestones) if item["status"] == "accepted"),\n        None,\n    )\n    current_milestone = dict(milestone) if milestone else latest_accepted_milestone\n'''
          if old not in s:
              raise SystemExit('control-plane milestone query marker missing')
          s = s.replace(old, new, 1)
          old_return = '''        "milestone": dict(milestone) if milestone else None,\n        "readiness": readiness,\n'''
          new_return = '''        "milestone": dict(milestone) if milestone else None,\n        "current_milestone": current_milestone,\n        "milestones": milestones,\n        "readiness": readiness,\n'''
          if old_return not in s:
              raise SystemExit('control-plane return marker missing')
          s = s.replace(old_return, new_return, 1)
          p.write_text(s)

          # Principal context: preserve both active and latest accepted milestone.
          p = Path('scripts/supervision.py')
          s = p.read_text()
          old = '''    milestone = store.conn.execute(\n        "SELECT * FROM milestones WHERE project_id = ? AND status = 'active'",\n        (project_id,),\n    ).fetchone()\n    return {\n        "project": project,\n        "active_objective": dict(objective) if objective else None,\n        "active_milestone": dict(milestone) if milestone else None,\n        "semantic_revision": store.project_revision(project_id),\n    }\n'''
          new = '''    milestone = store.conn.execute(\n        "SELECT * FROM milestones WHERE project_id = ? AND status = 'active'",\n        (project_id,),\n    ).fetchone()\n    latest_accepted = store.conn.execute(\n        """SELECT * FROM milestones\n           WHERE project_id = ? AND status = 'accepted'\n           ORDER BY ordinal DESC, accepted_at DESC, created_at DESC LIMIT 1""",\n        (project_id,),\n    ).fetchone()\n    return {\n        "project": project,\n        "active_objective": dict(objective) if objective else None,\n        "active_milestone": dict(milestone) if milestone else None,\n        "latest_accepted_milestone": dict(latest_accepted) if latest_accepted else None,\n        "semantic_revision": store.project_revision(project_id),\n    }\n'''
          if old not in s:
              raise SystemExit('supervision project context marker missing')
          p.write_text(s.replace(old, new, 1))

          # UI: prefer the exact milestone target for a Principal decision; otherwise
          # active, then latest accepted. Project cards use current_milestone too.
          p = Path('scripts/portfolio_dashboard.py')
          s = p.read_text()
          old = '''        affected = item.get("affected_state") or {}\n        milestone = affected.get("active_milestone") or {}\n        cards.append(\n'''
          new = '''        affected = item.get("affected_state") or {}\n        target = affected.get("target") or {}\n        target_state = target.get("state") or {}\n        milestone = (\n            target_state if target.get("type") == "milestone" and target_state\n            else affected.get("active_milestone")\n            or affected.get("latest_accepted_milestone")\n            or {}\n        )\n        milestone_status = str(milestone.get("status") or "").replace("_", " ").title()\n        cards.append(\n'''
          if old not in s:
              raise SystemExit('decision strip milestone marker missing')
          s = s.replace(old, new, 1)
          old = '''            f"<span class='decision-context'>{_safe(milestone.get('title') or 'No active milestone')}</span></div>"\n'''
          new = '''            f"<span class='decision-context'>{_safe(milestone.get('title') or 'Project-level decision')}{' · ' + _safe(milestone_status) if milestone_status else ''}</span></div>"\n'''
          if old not in s:
              raise SystemExit('decision context display marker missing')
          s = s.replace(old, new, 1)
          old = '''    milestone = project.get("milestone") or {}\n    pct, progress_label = _progress(project)\n'''
          new = '''    milestone = project.get("current_milestone") or project.get("milestone") or {}\n    if milestone and milestone.get("status") == "accepted" and not project.get("milestone"):\n        pct, progress_label = 100, "Latest milestone accepted"\n    else:\n        pct, progress_label = _progress(project)\n'''
          if old not in s:
              raise SystemExit('project-card milestone marker missing')
          s = s.replace(old, new, 1)
          old = '''    milestone = project.get("milestone") or {}\n    graph = project.get("consequence_graph") or {}\n'''
          new = '''    milestone = project.get("current_milestone") or project.get("milestone") or {}\n    milestones = project.get("milestones") or []\n    graph = project.get("consequence_graph") or {}\n'''
          if old not in s:
              raise SystemExit('project-detail milestone marker missing')
          s = s.replace(old, new, 1)
          old = '''<p class='objective'>{_safe(objective.get('title') or 'No active objective')} · {_safe(milestone.get('title') or 'No active milestone')}</p><section class='detail-card'><h2>Live agents</h2>'''
          new = '''<p class='objective'>{_safe(objective.get('title') or 'Objective complete')} · {_safe(milestone.get('title') or 'No milestone recorded')}</p><section class='detail-card'><h2>Milestones</h2><div class='detail-list'>{''.join(f"<div><strong>{_safe(m.get('ordinal'))}. {_safe(m.get('title'))}</strong> · {_safe(str(m.get('status') or '').title())}</div>" for m in milestones) or 'No milestones recorded.'}</div></section><section class='detail-card'><h2>Live agents</h2>'''
          if old not in s:
              raise SystemExit('project-detail header marker missing')
          p.write_text(s.replace(old, new, 1))

          # Release metadata.
          Path('VERSION').write_text('0.1.5\n')
          readme = Path('README.md').read_text().replace('# Lattice App Works 0.1.4', '# Lattice App Works 0.1.5', 1)
          Path('README.md').write_text(readme)
          manifest_path = Path('seed/SEED-MANIFEST.json')
          manifest = json.loads(manifest_path.read_text())
          manifest['version'] = '0.1.5'
          manifest_path.write_text(json.dumps(manifest, indent=2) + '\n')
          cs = Path('scripts/control_server.py')
          text = cs.read_text().replace('LatticeControl/0.1.4', 'LatticeControl/0.1.5')
          cs.write_text(text)
          changelog = Path('CHANGELOG.md')
          ch = changelog.read_text()
          entry = '''## 0.1.5\n\n- Preserve milestone context after Assurance acceptance so Principal launch decisions remain attached to the exact accepted release milestone.\n- Expose complete milestone history in the project read model and detail screen.\n- Use the latest accepted milestone as the portfolio card context when a project has no active milestone.\n\n'''
          if '## 0.1.5' not in ch:
              ch = ch.replace('# Changelog\n\n', '# Changelog\n\n' + entry, 1)
          changelog.write_text(ch)

          # Focused regressions.
          p = Path('tests/test_supervision.py')
          s = p.read_text()
          insert = '''\n    def test_principal_launch_decision_keeps_accepted_milestone_context(self) -> None:\n        self.store.conn.execute(\n            "UPDATE milestones SET status = 'accepted', accepted_at = ? WHERE id = ?",\n            ("2026-08-23T20:00:00Z", "milestone-001"),\n        )\n        self.store.raise_exception(\n            "project-001",\n            "production-launch-after-acceptance",\n            "Authorize production launch",\n            "All routine delivery gates are complete; production distribution requires Principal authorization.",\n            "critical",\n            "director",\n            "director",\n            True,\n            "milestone",\n            "milestone-001",\n        )\n        inbox = principal_inbox(self.store, "project-001")\n        item = next(i for i in inbox["items"] if i["title"] == "Authorize production launch")\n        self.assertIsNone(item["affected_state"]["active_milestone"])\n        self.assertEqual(item["affected_state"]["latest_accepted_milestone"]["id"], "milestone-001")\n        self.assertEqual(item["affected_state"]["target"]["state"]["status"], "accepted")\n\n'''
          marker = '\n\nif __name__ == "__main__":\n'
          if insert.strip() not in s:
              s = s.replace(marker, insert + marker, 1)
          p.write_text(s)

          p = Path('tests/test_control_plane.py')
          s = p.read_text()
          # Add a compact assertion to the existing read-model test via a stable phrase.
          needle = 'self.assertEqual(model["projects"][0]["project"]["id"], "project-001")'
          if needle in s and '"current_milestone"' not in s:
              s = s.replace(needle, needle + '\n            self.assertIn("current_milestone", model["projects"][0])\n            self.assertIn("milestones", model["projects"][0])', 1)
          p.write_text(s)
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add scripts/control_plane.py scripts/supervision.py scripts/portfolio_dashboard.py scripts/control_server.py tests/test_supervision.py tests/test_control_plane.py VERSION README.md seed/SEED-MANIFEST.json CHANGELOG.md
          git commit -m "Preserve accepted milestone context for Principal decisions"
          git push origin HEAD:fix/0.1.5-principal-milestone-context
