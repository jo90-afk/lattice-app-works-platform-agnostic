name: Temporary portfolio dashboard patch

on:
  pull_request:
    branches: [master]

permissions:
  contents: write

jobs:
  patch:
    if: github.head_ref == 'feat/0.1.3-portfolio-agent-dashboard'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/0.1.3-portfolio-agent-dashboard
      - name: Apply portfolio dashboard integration
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json

          p = Path('scripts/control_server.py')
          s = p.read_text()
          if 'from portfolio_dashboard import render_portfolio_html, render_project_html' not in s:
              s = s.replace('from lifecycle import fulfill_commitment_action, resolve_exception_action\n', 'from lifecycle import fulfill_commitment_action, resolve_exception_action\nfrom portfolio_dashboard import render_portfolio_html, render_project_html\n', 1)
          marker = 'def render_html(model: dict, flash: str | None = None, flash_error: bool = False) -> str:\n'
          if marker not in s:
              raise SystemExit('render_html marker missing')
          if marker + '    return render_portfolio_html(model, flash, flash_error)\n' not in s:
              s = s.replace(marker, marker + '    return render_portfolio_html(model, flash, flash_error)\n', 1)
          s = s.replace('server_version = "LatticeControl/0.1.2"', 'server_version = "LatticeControl/0.1.3"', 1)
          route = '''            elif parsed.path in {"/", "/index.html"}:\n                payload = render_html(self._model(), query.get("message", [None])[0], query.get("error", ["0"])[0] == "1").encode()\n                status, content_type = 200, "text/html; charset=utf-8"\n'''
          replacement = '''            elif parsed.path in {"/", "/index.html"}:\n                payload = render_html(self._model(), query.get("message", [None])[0], query.get("error", ["0"])[0] == "1").encode()\n                status, content_type = 200, "text/html; charset=utf-8"\n            elif parsed.path == "/project":\n                project_id = query.get("project", [""])[0]\n                payload = render_project_html(self._model(), project_id).encode()\n                status, content_type = 200, "text/html; charset=utf-8"\n'''
          if route not in s:
              raise SystemExit('root route marker missing')
          s = s.replace(route, replacement, 1)
          p.write_text(s)

          Path('VERSION').write_text('0.1.3\n')
          readme = Path('README.md').read_text().replace('# Lattice App Works 0.1.2', '# Lattice App Works 0.1.3', 1)
          Path('README.md').write_text(readme)
          manifest_path = Path('seed/SEED-MANIFEST.json')
          manifest = json.loads(manifest_path.read_text())
          manifest['version'] = '0.1.3'
          manifest_path.write_text(json.dumps(manifest, indent=2) + '\n')

          changelog = Path('CHANGELOG.md').read_text()
          entry = '''## 0.1.3\n\n- Rebuilt the human surface as a warm portfolio dashboard modeled on the public Lattice site rather than an operations console.\n- Made projects the primary management unit with compact milestone progress and a live per-project agent status roster derived from leases, verification, frontier work, blocked conditions, and Assurance readiness.\n- Moved evidence, consequence state, and deeper project information to a separate project-detail screen.\n- Kept ordinary exceptions inside project management; the top-level human decision strip appears only for state already classified as Principal-only by governance.\n\n'''
          if '## 0.1.3' not in changelog:
              changelog = changelog.replace('# Changelog\n\n', '# Changelog\n\n' + entry, 1)
          Path('CHANGELOG.md').write_text(changelog)

          test = Path('tests/test_control_server.py')
          ts = test.read_text()
          start = ts.index('    def test_rendered_surface_has_decision_first_information_architecture_and_action(self):')
          end = ts.index('    def test_principal_action_uses_current_guarded_action_and_closes_exception(self):')
          replacement_test = '''    def test_rendered_surface_is_project_first_with_live_agents_and_true_principal_exception(self):\n        with tempfile.TemporaryDirectory() as temporary:\n            folder = Path(temporary)\n            with self._store(folder) as store:\n                model = supervision_model(store, "project-001")\n                page = render_html(model)\n\n            self.assertEqual(model["state_backend"], "sqlite")\n            self.assertIn("Project Portfolio", page)\n            self.assertIn("Active Projects", page)\n            self.assertIn("Agents", page)\n            self.assertIn("Application", page)\n            self.assertIn("Ready", page)\n            self.assertIn("Needs your decision", page)\n            self.assertIn("Authorize external publication", page)\n            self.assertIn("Project detail", page)\n            self.assertNotIn("What changed", page)\n            self.assertNotIn("Inspect evidence and consequence state", page)\n\n'''
          test.write_text(ts[:start] + replacement_test + ts[end:])
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add scripts/control_server.py tests/test_control_server.py VERSION README.md seed/SEED-MANIFEST.json CHANGELOG.md
          git commit -m "Integrate portfolio and agent dashboard"
          git push origin HEAD:feat/0.1.3-portfolio-agent-dashboard
